  --tw-text-opacity: 1;
  color: rgb(143 217 255 / var(--tw-text-opacity, 1));
}

.text-\[var\(--ink\)\] {
  color: var(--ink);
}

.text-\[var\(--muted\)\] {
  color: var(--muted);
}

.text-emerald-600 {
  --tw-text-opacity: 1;
  color: rgb(5 150 105 / var(--tw-text-opacity, 1));
}

.text-slate-300 {
  --tw-text-opacity: 1;
  color: rgb(203 213 225 / var(--tw-text-opacity, 1));
}

.text-white {
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}

.line-through {
  text-decoration-line: line-through;
}

.accent-\[\#2E5BFF\] {
  accent-color: #2E5BFF;
}

.opacity-20 {
  opacity: 0.2;
}

.opacity-30 {
  opacity: 0.3;
}

.shadow-xl {
  --tw-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
  --tw-shadow-colored: 0 20px 25px -5px var(--tw-shadow-color), 0 8px 10px -6px var(--tw-shadow-color);
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.blur-3xl {
  --tw-blur: blur(64px);
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

:root{
  --navy:#0A1633;
  --navy2:#122451;
  --blue:#2E5BFF;
  --cyan:#00C2FF;
  --ink:#0E1730;
  --muted:#5B6B88;
  --line:#DCE4F2;
  --surface:#FFFFFF;
  --bg:#F2F5FB;
  --soft:#EAF0FF;
  --mint:#E7FBF6;
  --amber:#FFF6E5;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark){
  :root{
    --ink:#F2F6FF;
    --muted:#A9B7D4;
    --line:#2A3B66;
    --surface:#111E3D;
    --bg:#081126;
    --soft:#182A57;
    --mint:#143B36;
    --amber:#3A2E18;
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  line-height:1.65
}

a{
  color:inherit
}

button{
  font:inherit
}

.wrap{
  max-width:1280px;
  margin:0 auto;
  padding:0 20px
}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:0 8px 28px rgba(10,22,51,.06)
}

.eyebrow{
  font-size:12px;
  letter-spacing:.16em;
  font-weight:800;
  color:var(--blue);
  text-transform:uppercase
}

h2{
  font-size:30px;
  line-height:1.25;
  letter-spacing:-.02em;
  margin:8px 0 10px
}

.lead{
  color:var(--muted);
  margin:0;
  max-width:820px
}

.chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  border:1px solid var(--line);
  border-radius:999px;
  padding:5px 10px;
  font-size:12px;
  font-weight:700;
  background:var(--surface)
}

.table-wrap{
  overflow-x:auto;
  border:1px solid var(--line);
  border-radius:14px
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:640px;
  font-size:14px
}

th{
  background:var(--navy);
  color:#fff;
  text-align:left;
  padding:12px 14px;
  font-weight:700
}

td{
  padding:12px 14px;
  border-top:1px solid var(--line);
  vertical-align:top
}

tbody tr:nth-child(even) td{
  background:color-mix(in srgb, var(--soft) 45%, transparent)
}

.mini{
  font-size:13px;
  color:var(--muted)
}

.kpi{
  font-size:28px;
  font-weight:900;
  letter-spacing:-.03em
}

@media(max-width:640px){
  h2{
    font-size:24px
  }

  .kpi{
    font-size:22px
  }
}

@media print{
  .no-print{
    display:none!important
  }

  body{
    background:#fff
  }

  .card{
    box-shadow:none;
    -moz-column-break-inside:avoid;
         break-inside:avoid
  }

  section{
    -moz-column-break-inside:auto;
         break-inside:auto
  }
}

.hover\:border-\[\#2E5BFF\]:hover {
  --tw-border-opacity: 1;
  border-color: rgb(46 91 255 / var(--tw-border-opacity, 1));
}

.hover\:bg-\[var\(--soft\)\]:hover {
  background-color: var(--soft);
}

.hover\:bg-white\/10:hover {
  background-color: rgb(255 255 255 / 0.1);
}

@media (min-width: 640px) {
  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}

@media (min-width: 768px) {
  .md\:block {
    display: block;
  }

  .md\:inline {
    display: inline;
  }

  .md\:hidden {
    display: none;
  }

  .md\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .md\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .md\:grid-cols-5 {
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }

  .md\:flex-row {
    flex-direction: row;
  }

  .md\:py-12 {
    padding-top: 3rem;
    padding-bottom: 3rem;
  }

  .md\:py-20 {
    padding-top: 5rem;
    padding-bottom: 5rem;
  }

  .md\:text-2xl {
    font-size: 1.5rem;
    line-height: 2rem;
  }

  .md\:text-\[64px\] {
    font-size: 64px;
  }
}

@media (min-width: 1024px) {
  .lg\:block {
    display: block;
  }

  .lg\:flex {
    display: flex;
  }

  .lg\:hidden {
    display: none;
  }

  .lg\:grid-cols-1 {
    grid-template-columns: repeat(1, minmax(0, 1fr));
  }

  .lg\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .lg\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .lg\:grid-cols-6 {
    grid-template-columns: repeat(6, minmax(0, 1fr));
  }

  .lg\:grid-cols-\[1\.4fr_\.8fr\] {
    grid-template-columns: 1.4fr .8fr;
  }

  .lg\:grid-cols-\[240px_1fr\] {
    grid-template-columns: 240px 1fr;
  }
}
